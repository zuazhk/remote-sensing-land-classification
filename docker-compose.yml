# 遥感图像分类系统 - Docker Compose
# 用于生产环境部署

version: '3.8'

services:
  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: remote-sensing-api:latest
    container_name: remote-sensing-backend
    restart: unless-stopped
    ports:
      - "8000:8000"  # 开发时可直接访问API
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - MODEL_PATH_PREFIX=/models
      - DATA_PATH_PREFIX=/data
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://frontend:80", "http://localhost:3000", "http://localhost:5173"]
      - MAX_IMAGE_SIZE_MB=10
      - BATCH_PREDICT_MAX_FILES=50
    volumes:
      # 挂载模型目录（只读）
      - ${MODELS_PATH:-/home/zhouh/biye/models}:/models:ro
      # 挂载数据目录（只读）
      - ${DATA_PATH:-/home/zhouh/biye/data}:/data:ro
      # 可选：挂载日志目录
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - remote-sensing-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # 前端Web应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建时API基础URL，指向后端服务
        - VITE_API_BASE_URL=/api/v1
    image: remote-sensing-frontend:latest
    container_name: remote-sensing-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # 主访问端口
      - "443:443"  # 预留HTTPS端口
    depends_on:
      - backend
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - remote-sensing-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # 可选：数据库服务（如需持久化用户数据）
  # postgres:
  #   image: postgres:15-alpine
