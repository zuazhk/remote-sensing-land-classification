  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - remote-sensing-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U app_user"]
  #     interval: 30s
