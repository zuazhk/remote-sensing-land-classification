[project]
name = "remote-sensing-api"
version = "1.0.0"
description = "Remote Sensing Image Classification API - Modern SPA Version"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "markupsafe==3.0.2",
    "numpy>=2.3.5",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.25",
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "uvicorn>=0.41.0",
]

[tool.uv]
index = [
    { name = "pytorch", url = "https://download.pytorch.org/whl/cu121", priority = "explicit" },
    { name = "tsinghua", url = "https://pypi.tuna.tsinghua.edu.cn/simple", priority = "highest" },
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "B", "W", "UP"]
ignore = []

[tool.ruff.isort]
known-first-party = ["backend"]

[tool.hatch.build.targets.wheel]
packages = ["."]
